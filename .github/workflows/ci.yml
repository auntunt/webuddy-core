# CI：把本地那一趟检查原样跑在两个系统 × 两个 Node 版本上。
#
# 为什么要 matrix：本地只有 macOS。各家的命令行工具行为不一样——
# 踩过两次：① mktemp，`mktemp -t 名字` 在 macOS 上是前缀，在 GNU coreutils 上
# 要求模板末尾至少 6 个 X，不补就直接报错；② Windows 上 os.homedir() 认的是
# %USERPROFILE% 而不是 $HOME，只设 HOME 的测试会污染真实用户目录。
# 这类差异在一台机器上永远看不见，v0.1.0 发版时 Windows 那两格就是这么红的。
#
# 每个多行 run 都写死 shell: bash —— Windows runner 的默认 shell 是 pwsh，
# 不写的话 `for p in …; do` 这种写法当场语法错。
#
# 步骤顺序照本地那一趟：先跑单元测试，再跑三个包的自测与体检，最后查内核纯净。
# 顺序不是随意的——内核纯净那一步最快，但放最后是为了让"判错了"比"写脏了"先暴露。

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      # 一个组合红了，别的照跑完：只知道"有一处红了"没法定位是系统差异还是版本差异。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 参照实现只在复核 golden 时用得上（scripts/gen-golden-from-ref.mjs），
      # 但布局要跟本地一致：.ref/webuddy-console 加一个 ref → .ref 的符号链接，
      # 这样文档里所有 ref/webuddy-console/… 的路径原样可用。
      # node --test 会走进 ref 底下的 .test.js 并全部失败，所以放在点开头的目录里
      # （实测 node --test 跳过点开头目录，也不跟进符号链接指向的目录）。
      - name: clone-ref
        shell: bash
        run: |
          git clone --depth 1 https://github.com/auntunt/webuddy-console.git .ref/webuddy-console
          # Windows 的 MSYS 上 ln -s 默认是拷贝、还可能直接失败。
          # ref/ 只有 scripts/gen-golden-from-ref.mjs 用得上，测试一趟都不碰它，
          # 所以这一步失败不算数（golden 用的是 test/fixtures/ 下自带的素材）。
          ln -s .ref ref || echo "建不了符号链接（Windows 常见），跳过——测试不依赖 ref/"

      # 失败时把测试名和断言摘成 ::error:: 注解。
      # 原因很实际：Actions 的日志要仓库 admin 权限才读得到，而 check 注解
      # 是公开可读的 —— 红了之后不必先去翻网页就能知道是哪条测试炸了。
      - name: unit-tests
        shell: bash
        run: |
          set +e
          # 固定用 TAP 报告器：默认报告器在非终端下的格式随版本变，
          # 而下面要按行解析它，格式一变就什么都摘不出来。
          node --test --test-reporter=tap 2>&1 | tee test-output.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Actions 的日志要仓库 admin 才读得到（实测 403），而 check 注解公开可读。
            # 汇成一条而不是一条失败一条注解：GitHub 每步最多显示 10 条注解，
            # 分开发会被截断，而被截断的那几条恰恰可能是关键的。
            node -e '
              const fs = require("fs");
              const lines = fs.readFileSync("test-output.txt", "utf8").split(/\r?\n/);
              const out = [];
              for (let i = 0; i < lines.length; i++) {
                const m = /^(\s*)not ok \d+ - (.+)$/.exec(lines[i]);
                if (!m) continue;
                // 诊断块：--- 到 ... 之间。error 可能是 YAML 块标量（|-），
                // 那种情况下真正的话在后面几行缩进里，只读 error: 这一行等于没读。
                const block = [];
                for (let j = i + 1; j < Math.min(i + 60, lines.length); j++) {
                  if (/^\s*\.\.\.\s*$/.test(lines[j])) break;
                  block.push(lines[j]);
                }
                const text = block.join("\n");
                if (/failureType:\s*.subtestsFailed./.test(text)) continue;
                const keep = block
                  .filter((l) => !/^\s*(duration_ms|location|failureType|stack|\*?at\s|---)/.test(l))
                  .map((l) => l.trim())
                  .filter(Boolean)
                  .slice(0, 8);
                out.push("✖ " + m[2] + "\n    " + keep.join("\n    "));
              }
              const msg = out.slice(0, 40).join("\n\n").slice(0, 30000);
              const esc = msg.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
              console.log("::error title=Windows 上失败的测试::" + esc);
              console.log("（共 " + out.length + " 条失败）");
            '
          fi
          exit "$code"
      - name: pack-test
        shell: bash
        run: |
          for p in software-engineering construction-safety financial-audit; do
            node bin/webuddy.js pack test "packs/$p"
          done

      - name: pack-lint
        shell: bash
        run: |
          for p in software-engineering construction-safety financial-audit; do
            node bin/webuddy.js pack lint "packs/$p" --strict
          done

      # 内核里不许出现任何行业专有物。grep -c 数出来必须是 0；
      # grep 找不到时退出码是 1，所以这里看的是计数，不是退出码。
      - name: kernel-purity
        shell: bash
        run: |
          # grep 一个都没找到时退出码是 1，而 shell: bash 会带上 -o pipefail ——
          # 直接写 `grep … | wc -l` 会把「内核是干净的」变成 CI 失败（实测踩过）。
          # 加 `|| true` 又会把「内核脏了」变成通过，两种写法都是反的。
          # 所以用 if 接住 grep 的退出码，不在管道里数数。
          if hits=$(grep -rEn "八步|场景卡|scope-card|01-scope|TEST_HINT|SCHEMA_HINT|software" src/kernel/); then
            echo "内核里出现了行业专有物，这些得搬到包里去："
            printf '%s\n' "$hits"
            printf '%s\n' "$hits" | while IFS= read -r l; do echo "::error::内核纯净: ${l}"; done
            exit 1
          fi
          echo "内核纯净：0 命中"
